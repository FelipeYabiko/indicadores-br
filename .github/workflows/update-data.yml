name: Atualizar dados

on:
  schedule:
    # 22:17 UTC (19:17 em Brasília), de segunda a sexta, depois da publicação da PTAX.
    - cron: "17 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: indicadores atualizar
      - run: indicadores resumo >> "$GITHUB_STEP_SUMMARY"
      - name: Commit se houver dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhum dado novo."
          else
            git commit -m "Atualiza dados ($(date -u +%Y-%m-%d))"
            git push
          fi
